<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Login | Traffic Signal Optimizer</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-page">
<div class="auth-card">
  <div class="brand">🚦 Traffic Signal Optimizer</div>
  <p class="muted">Smart traffic analysis and signal timing</p>
  <h1>Login</h1>
  <label>Username</label><input id="username" placeholder="Enter username">
  <label>Password</label><input id="password" type="password" placeholder="Enter password">
  <button onclick="login()">Login</button>
  <p id="error" class="error"></p>
  <p class="hint">Demo: <b>admin</b> / <b>admin123</b></p>
</div>
<script>
function login(){
  const u=document.getElementById('username').value.trim(), p=document.getElementById('password').value;
  if(u==='admin' && p==='admin123'){
    sessionStorage.setItem('loggedIn','true'); location.href='home.html';
  } else document.getElementById('error').textContent='Please enter the correct username and password.';
}
</script>
</body></html>
